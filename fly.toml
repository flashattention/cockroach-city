# Fly.io 배포 설정  (app 이름은 전 세계에서 고유해야 해요: fly launch 가 바꿔줍니다)
app = "roach-city"
primary_region = "nrt"   # 도쿄 (한국에서 가장 가까움)

# 배포 때 서버가 세계를 저장할 시간을 준다
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]

[deploy]
  # 디스크(volume)가 붙은 머신 1대라 교체 방식으로 배포 (수 초간 끊김 → 브라우저 자동 재접속)
  strategy = "immediate"

[env]
  PORT = "8000"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # 세계 상태가 서버 메모리에 있으므로 머신은 항상 1대만, 꺼지지 않게
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "roach_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
